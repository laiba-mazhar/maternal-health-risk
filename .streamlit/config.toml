# Pinned to a light theme on purpose. This is a clinical-style tool where the
# risk-band colours carry meaning, and letting the OS flip the palette would
# change what "amber" and "red" look like against the background.
[theme]
base = "light"
primaryColor = "#1f6f8b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7f9"
textColor = "#1c2429"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
runOnSave = true
